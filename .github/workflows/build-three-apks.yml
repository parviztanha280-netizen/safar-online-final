name: Build 3 Safar Online APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. دریافت پروژه
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. ساخت سه نسخه از سورس اصلی
      # ==========================================
      - name: Prepare three applications
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PREPARING SAFAR ONLINE"
          echo "======================================"

          rm -rf safar-source
          mkdir -p safar-source

          # فایل‌های اصلی پروژه را به سه نسخه کپی می‌کنیم
          mkdir -p safar-source/passenger
          mkdir -p safar-source/driver
          mkdir -p safar-source/admin

          # --------------------------------------
          # Passenger
          # --------------------------------------
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ safar-source/passenger/

          # --------------------------------------
          # Driver
          # --------------------------------------
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ safar-source/driver/

          # --------------------------------------
          # Admin
          # --------------------------------------
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ safar-source/admin/

          echo ""
          echo "Three source folders created."

          echo ""
          echo "Passenger:"
          ls -la safar-source/passenger

          echo ""
          echo "Driver:"
          ls -la safar-source/driver

          echo ""
          echo "Admin:"
          ls -la safar-source/admin

          # --------------------------------------
          # بررسی package.json
          # --------------------------------------
          test -f safar-source/passenger/package.json
          test -f safar-source/driver/package.json
          test -f safar-source/admin/package.json

          # --------------------------------------
          # بررسی index.html
          # --------------------------------------
          test -f safar-source/passenger/index.html
          test -f safar-source/driver/index.html
          test -f safar-source/admin/index.html

          echo ""
          echo "SOURCE PREPARATION SUCCESSFUL."


      # ==========================================
      # 3. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 4. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 5. ساخت پوشه خروجی
      # ==========================================
      - name: Create output folder
        shell: bash
        run: |
          mkdir -p dist


      # ==========================================
      # 6. Passenger
      # ==========================================
      - name: Build Passenger APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING PASSENGER"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/passenger"

          npm install

          # تنظیم شناسه برنامه مسافر
          node -e "
          const fs=require('fs');
          const f='capacitor.config.json';
          if(fs.existsSync(f)){
            const c=JSON.parse(fs.readFileSync(f,'utf8'));
            c.appId='com.safaronline.app.passenger';
            c.appName='Safar Online - Passenger';
            fs.writeFileSync(f,JSON.stringify(c,null,2));
          }
          "

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-passenger.apk"

          echo "PASSENGER APK CREATED."


      # ==========================================
      # 7. Driver
      # ==========================================
      - name: Build Driver APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING DRIVER"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/driver"

          npm install

          # تنظیم شناسه برنامه راننده
          node -e "
          const fs=require('fs');
          const f='capacitor.config.json';
          if(fs.existsSync(f)){
            const c=JSON.parse(fs.readFileSync(f,'utf8'));
            c.appId='com.safaronline.app.driver';
            c.appName='Safar Online - Driver';
            fs.writeFileSync(f,JSON.stringify(c,null,2));
          }
          "

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-driver.apk"

          echo "DRIVER APK CREATED."


      # ==========================================
      # 8. Admin
      # ==========================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING ADMIN"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/admin"

          npm install

          # تنظیم شناسه برنامه مدیریت
          node -e "
          const fs=require('fs');
          const f='capacitor.config.json';
          if(fs.existsSync(f)){
            const c=JSON.parse(fs.readFileSync(f,'utf8'));
            c.appId='com.safaronline.app.admin';
            c.appName='Safar Online - Admin';
            fs.writeFileSync(f,JSON.stringify(c,null,2));
          }
          "

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-admin.apk"

          echo "ADMIN APK CREATED."


      # ==========================================
      # 9. بررسی APKها
      # ==========================================
      - name: Check APK files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL APK CHECK"
          echo "======================================"

          ls -lh dist/

          test -f dist/safar-online-passenger.apk
          test -f dist/safar-online-driver.apk
          test -f dist/safar-online-admin.apk

          echo ""
          echo "======================================"
          echo "SUCCESS"
          echo "ALL THREE APKs CREATED"
          echo "======================================"


      # ==========================================
      # 10. آپلود APKها
      # ==========================================
      - name: Upload 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-three-apks
          path: dist/*.apk
          if-no-files-found: error
