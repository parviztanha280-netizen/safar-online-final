name: Build 3 Safar Online APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. دریافت پروژه
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. آماده سازی سه برنامه
      # ==========================================
      - name: Prepare three applications
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PREPARING SAFAR ONLINE"
          echo "======================================"

          rm -rf safar-source
          rm -rf dist

          mkdir -p safar-source/passenger
          mkdir -p safar-source/driver
          mkdir -p safar-source/admin
          mkdir -p dist

          # --------------------------------------
          # کپی سورس اصلی به Passenger
          # --------------------------------------
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ safar-source/passenger/

          # --------------------------------------
          # کپی سورس اصلی به Driver
          # --------------------------------------
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ safar-source/driver/

          # --------------------------------------
          # کپی سورس اصلی به Admin
          # --------------------------------------
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ safar-source/admin/

          echo "Source copies created."


      # ==========================================
      # 3. تنظیم Passenger
      # ==========================================
      - name: Configure Passenger
        shell: bash
        run: |
          set -e

          cd safar-source/passenger

          rm -rf www
          mkdir -p www

          rsync -a \
            --exclude="www" \
            --exclude="android" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ www/

          node -e "
          const fs = require('fs');

          const file = 'capacitor.config.json';

          let config = {};

          if (fs.existsSync(file)) {
            try {
              config = JSON.parse(
                fs.readFileSync(file, 'utf8')
              );
            } catch (e) {
              config = {};
            }
          }

          config.appId = 'com.safaronline.app.passenger';
          config.appName = 'Safar Online Passenger';
          config.webDir = 'www';

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2)
          );
          "

          echo "Passenger configured."
          cat capacitor.config.json


      # ==========================================
      # 4. تنظیم Driver
      # ==========================================
      - name: Configure Driver
        shell: bash
        run: |
          set -e

          cd safar-source/driver

          rm -rf www
          mkdir -p www

          rsync -a \
            --exclude="www" \
            --exclude="android" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ www/

          node -e "
          const fs = require('fs');

          const file = 'capacitor.config.json';

          let config = {};

          if (fs.existsSync(file)) {
            try {
              config = JSON.parse(
                fs.readFileSync(file, 'utf8')
              );
            } catch (e) {
              config = {};
            }
          }

          config.appId = 'com.safaronline.app.driver';
          config.appName = 'Safar Online Driver';
          config.webDir = 'www';

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2)
          );
          "

          echo "Driver configured."
          cat capacitor.config.json


      # ==========================================
      # 5. تنظیم Admin
      # ==========================================
      - name: Configure Admin
        shell: bash
        run: |
          set -e

          cd safar-source/admin

          rm -rf www
          mkdir -p www

          rsync -a \
            --exclude="www" \
            --exclude="android" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ www/

          node -e "
          const fs = require('fs');

          const file = 'capacitor.config.json';

          let config = {};

          if (fs.existsSync(file)) {
            try {
              config = JSON.parse(
                fs.readFileSync(file, 'utf8')
              );
            } catch (e) {
              config = {};
            }
          }

          config.appId = 'com.safaronline.app.admin';
          config.appName = 'Safar Online Admin';
          config.webDir = 'www';

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2)
          );
          "

          echo "Admin configured."
          cat capacitor.config.json


      # ==========================================
      # 6. بررسی سورس
      # ==========================================
      - name: Verify source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING SOURCE"
          echo "======================================"

          test -f safar-source/passenger/www/index.html
          test -f safar-source/passenger/package.json
          test -f safar-source/passenger/capacitor.config.json

          test -f safar-source/driver/www/index.html
          test -f safar-source/driver/package.json
          test -f safar-source/driver/capacitor.config.json

          test -f safar-source/admin/www/index.html
          test -f safar-source/admin/package.json
          test -f safar-source/admin/capacitor.config.json

          echo ""
          echo "Passenger web files:"
          find safar-source/passenger/www -maxdepth 2 -type f | sort

          echo ""
          echo "Driver web files:"
          find safar-source/driver/www -maxdepth 2 -type f | sort

          echo ""
          echo "Admin web files:"
          find safar-source/admin/www -maxdepth 2 -type f | sort

          echo ""
          echo "SOURCE CHECK PASSED."


      # ==========================================
      # 7. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 8. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 9. Passenger APK
      # ==========================================
      - name: Build Passenger APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING PASSENGER APK"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/passenger"

          npm install

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-passenger.apk"

          echo ""
          echo "PASSENGER APK CREATED."


      # ==========================================
      # 10. Driver APK
      # ==========================================
      - name: Build Driver APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING DRIVER APK"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/driver"

          npm install

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-driver.apk"

          echo ""
          echo "DRIVER APK CREATED."


      # ==========================================
      # 11. Admin APK
      # ==========================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/admin"

          npm install

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-admin.apk"

          echo ""
          echo "ADMIN APK CREATED."


      # ==========================================
      # 12. بررسی نهایی APKها
      # ==========================================
      - name: Check APK files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL APK CHECK"
          echo "======================================"

          ls -lh dist/

          test -f dist/safar-online-passenger.apk
          test -f dist/safar-online-driver.apk
          test -f dist/safar-online-admin.apk

          echo ""
          echo "======================================"
          echo "SUCCESS - ALL 3 APKs CREATED"
          echo "======================================"


      # ==========================================
      # 13. آپلود سه APK
      # ==========================================
      - name: Upload 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-three-apks
          path: dist/*.apk
          if-no-files-found: error
