          cat > build-source/admin/www/index.html <<'HTML'
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سفر آنلاین - مدیریت</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6f8;margin:0;padding:20px;color:#17202a}
.box{max-width:700px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px #0001}
button{width:100%;padding:14px;margin:7px 0;border-radius:10px;background:#222;color:#fff;border:0;font-size:16px;font-weight:bold}
.ride{background:#f1f1f1;padding:15px;border-radius:12px;margin:12px 0}
.status{padding:14px;background:#f5f5f5;border-radius:10px}
</style>
</head>
<body>

<div class="box">

<h1>👑 سفر آنلاین</h1>
<h3>مرکز مدیریت</h3>

<button id="refresh">
🔄 دریافت سفرها
</button>

<div id="status" class="status">
در حال اتصال...
</div>

<div id="list"></div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCBVjmIfqL0fHTu76PfrMHVgAVwB_uZb30",
authDomain:"safaronline.firebaseapp.com",
projectId:"safaronline",
storageBucket:"safaronline.firebasestorage.app",
messagingSenderId:"945083323788",
appId:"1:945083323788:android:1262253896af037e9cf2a9"
};

const statusEl=
document.getElementById("status");

let db;

try{

db=getFirestore(
initializeApp(firebaseConfig)
);

statusEl.textContent=
"✅ اتصال مدیریت آماده است.";

}catch(e){

statusEl.textContent=
"❌ خطای اتصال Firebase:\n"+
(e?.message||e);

}

function load(){

if(!db)return;

statusEl.textContent=
"⏳ در حال دریافت سفرها...";

onSnapshot(
collection(db,"rides"),
snapshot=>{

const list=
document.getElementById("list");

list.innerHTML="";

if(snapshot.empty){

statusEl.textContent=
"هیچ سفری ثبت نشده است.";

return;
}

statusEl.textContent=
"✅ تعداد سفرها: "+
snapshot.size;

snapshot.forEach(item=>{

const r=item.data();

const box=
document.createElement("div");

box.className="ride";

box.innerHTML=
"<b>مسافر:</b> "+(r.name||"-")+
"<br><b>مبدأ:</b> "+(r.from||"-")+
"<br><b>مقصد:</b> "+(r.to||"-")+
"<br><b>کرایه:</b> "+(r.fare||0)+
"<br><b>وضعیت:</b> "+(r.status||"-")+
"<br><b>راننده:</b> "+(r.driverName||"-")+
"<br><b>پلاک:</b> "+(r.plate||"-");

list.appendChild(box);

});

},
e=>{

statusEl.textContent=
"❌ خطا در دریافت سفرها:\n"+
(e?.message||e);

});

}

document
.getElementById("refresh")
.addEventListener("click",load);

load();

</script>

</body>
</html>
