name: Build Safar Online - 3 APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create three apps
        shell: bash
        run: |
          set -e
          rm -rf build-source dist
          mkdir -p build-source/passenger/www
          mkdir -p build-source/driver/www
          mkdir -p build-source/admin/www
          mkdir -p dist

          echo ' b3JkZXItcmFkaXVzOjE4cHh9aW5wdXQsYnV0dG9ue3dpZHRoOjEwMCU7cGFkZGluZzoxNHB4O21hcmdpbjo3cHggMDtib3JkZXItcmFkaXVzOjEwcHg7Ym94LXNpemluZzpib3JkZXItYm94fWJ1dHRvbntiYWNrZ3JvdW5kOiMxNTk0NDc7Y29sb3I6d2hpdGU7Ym9yZGVyOjA7Zm9udC13ZWlnaHQ6Ym9sZH0j ' | base64 -d > build-source/passenger/www/index.html

          echo ' ' | base64 -d > build-source/driver/www/index.html

          echo ' b3JkZXItcmFkaXVzOjE4cHh9LnJpZGV7Ym9yZGVyOjFweCBzb2xpZCAjZGRkO2JvcmRlci1yYWRpdXM6MTJweDtwYWRkaW5nOjE0cHg7bWFyZ2luOjEwcHggMH08L3N0eWxlPjxtYWluPjxoMj7wn5CYINmF2KfZhNix2KjZhyB8INmF2KfZhNix2KjZhyDwn5CSPC9oMj48cCBpZD0ibXNnIj7YqNmI2KjZhyDYp9mE2KfZhtmI2KjZhy4uLjwv cD48ZGl2IGlkPSJyaWRlcyI+PC9kaXY+PC9tYWluPjwvaHRtbD4=' | base64 -d > build-source/admin/www/index.html

          for role in passenger driver admin; do
            cd build-source/$role
            npm init -y
            npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

            cat > capacitor.config.json <<EOF
          {
            "appId": "com.safaronline.app.$role",
            "appName": "Safar Online",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

            npx cap add android
            npx cap sync android
            cd ../..
          done

      - name: Build Passenger
        shell: bash
        run: |
          set -e
          cd build-source/passenger
          ./android/gradlew assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk ../../dist/safar-online-passenger.apk

      - name: Build Driver
        shell: bash
        run: |
          set -e
          cd build-source/driver
          ./android/gradlew assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk ../../dist/safar-online-driver.apk

      - name: Build Admin
        shell: bash
        run: |
          set -e
          cd build-source/admin
          ./android/gradlew assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk ../../dist/safar-online-admin.apk

      - name: Verify APKs
        shell: bash
        run: |
          set -e
          ls -lh dist
          test -s dist/safar-online-passenger.apk
          test -s dist/safar-online-driver.apk
          test -s dist/safar-online-admin.apk

      - name: Upload 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-3-apks-fixed
          path: dist/*.apk
