name: Build Safar Online - Final 3 APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create complete Safar Online apps
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source dist
          mkdir -p build-source/passenger/www
          mkdir -p build-source/driver/www
          mkdir -p build-source/admin/www
          mkdir -p dist

          cat > build-source/passenger/www/index.html <<'HTML'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#159447">
            <title>سفر آنلاین - مسافر</title>
            <style>
              *{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f7f4;color:#18231d}
              .wrap{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 5px 24px #00000012;margin-bottom:14px}
              h1{margin:0 0 4px;color:#159447;font-size:27px}.sub{color:#65736b;margin:0 0 18px}
              label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,button{width:100%;padding:14px;border-radius:12px;font:inherit}
              input{border:1px solid #d8e1db;background:#fff}button{border:0;background:#159447;color:#fff;font-weight:700;margin-top:14px}
              button:disabled{opacity:.55}.status{padding:12px;border-radius:12px;background:#eef7f1;margin-top:14px;line-height:1.8}
              .ride{border:1px solid #dce7df;border-radius:14px;padding:14px;margin-top:12px;background:#fbfdfb}
              .row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}.muted{color:#68766e;font-size:13px}
              .danger{background:#b42318}.ok{color:#137333;font-weight:700}.err{color:#b42318;font-weight:700}
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="card">
                <h1>🚕 سفر آنلاین</h1>
                <p class="sub">سامانه آنلاین درخواست موتر</p>

                <label>نام مسافر</label>
                <input id="name" placeholder="نام و نام خانوادگی">

                <label>شماره تماس</label>
                <input id="phone" inputmode="tel" placeholder="07XXXXXXXX">

                <label>مبدا</label>
                <input id="from" placeholder="مثلاً: کارته چهار">

                <label>مقصد</label>
                <input id="to" placeholder="مثلاً: شهرنو">

                <label>کرایه به افغانی</label>
                <input id="fare" type="number" min="0" inputmode="decimal" placeholder="مثلاً: 250">

                <button id="request">🚕 درخواست سفر</button>
                <div id="msg" class="status">آماده دریافت درخواست شما.</div>
              </div>

              <div id="current" class="card" style="display:none">
                <h3>وضعیت سفر</h3>
                <div id="rideBox"></div>
              </div>
            </div>

            <script>
              const PROJECT="safaronline";
              const API_KEY="AIzaSyCBVjmIfqL0fHTu76PfrMHVgAVwB_uZb30";
              const BASE=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;
              let rideName=null, poll=null;

              function field(v){return v && v.stringValue!==undefined ? v.stringValue : "";}
              function numberField(v){
                if(!v) return 0;
                if(v.doubleValue!==undefined) return Number(v.doubleValue);
                if(v.integerValue!==undefined) return Number(v.integerValue);
                return 0;
              }
              function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
              function message(t, cls=""){const el=document.getElementById("msg");el.className="status "+cls;el.textContent=t;}

              async function createRide(){
                const name=document.getElementById("name").value.trim();
                const phone=document.getElementById("phone").value.trim();
                const from=document.getElementById("from").value.trim();
                const to=document.getElementById("to").value.trim();
                const fare=Number(document.getElementById("fare").value||0);

                if(!name||!phone||!from||!to){message("نام، شماره، مبدا و مقصد را کامل وارد کنید.","err");return;}
                if(fare<0){message("کرایه معتبر نیست.","err");return;}

                const btn=document.getElementById("request");
                btn.disabled=true;
                message("در حال ثبت درخواست در سرور...");

                const body={fields:{
                  passengerName:{stringValue:name},
                  phone:{stringValue:phone},                  to:{stringValue:to},
                  fare:{doubleValue:fare},
                  status:{stringValue:"requested"},
                  createdAt:{timestampValue:new Date().toISOString()}
                }};

                try{
                  const r=await fetch(`${BASE}/rides?key=${API_KEY}`,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify(body)
                  });

                  const j=await r.json();

                  if(!r.ok){
                    throw new Error(j?.error?.message||"خطای Firestore");
                  }

                  rideName=j.name;

                  document.getElementById("current").style.display="block";
                  message("✅ سفر ثبت شد. منتظر راننده بمانید.","ok");
                  render(j.fields||body.fields);

                  if(poll) clearInterval(poll);
                  poll=setInterval(loadRide,4000);

                }catch(e){
                  console.error(e);
                  message("❌ ثبت نشد: "+e.message,"err");
                  btn.disabled=false;
                }
              }

              function render(f){
                const status=field(f.status);
                const labels={
                  requested:"در انتظار راننده",
                  accepted:"راننده سفر را قبول کرد",
                  started:"سفر شروع شد",
                  completed:"سفر پایان یافت",
                  cancelled:"سفر لغو شد"
                };

                document.getElementById("rideBox").innerHTML=
                  `<div class="ride">
                    <div class="row"><b>وضعیت</b><b>${esc(labels[status]||status)}</b></div>
                    <div class="row"><span>مبدا</span><span>${esc(field(f.from))}</span></div>
                    <div class="row"><span>مقصد</span><span>${esc(field(f.to))}</span></div>
                    <div class="row"><span>کرایه</span><span>${numberField(f.fare)} افغانی</span></div>
                    ${field(f.driverName)?`<div class="row"><span>راننده</span><span>${esc(field(f.driverName))}</span></div>`:""}
                    ${field(f.driverPlate)?`<div class="row"><span>پلاک</span><span>${esc(field(f.driverPlate))}</span></div>`:""}
                  </div>`;
              }

              async function loadRide(){
                if(!rideName)return;

                try{
                  const r=await fetch(`${BASE}/${rideName}?key=${API_KEY}`);

                  if(!r.ok)return;

                  const j=await r.json();
                  render(j.fields||{});

                  const s=field(j.fields?.status);

                  if(["completed","cancelled"].includes(s)){
                    clearInterval(poll);
                    document.getElementById("request").disabled=false;
                  }

                }catch(e){
                  console.log(e);
                }
              }

              document.getElementById("request").onclick=createRide;
            </script>
          </body>
          </html>
          HTML

          cat > build-source/driver/www/index.html <<'HTML'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#159447">
            <title>سفر آنلاین - راننده</title>
            <style>
              *{box-sizing:border-box}
              body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f7f4;color:#18231d}
              .wrap{max-width:680px;margin:auto;padding:16px}
              .card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 5px 24px #00000012;margin-bottom:14px}
              h1{margin:0 0 4px;color:#159447;font-size:27px}
              .sub{color:#65736b;margin:0 0 18px}
              label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
              input,button{width:100%;padding:14px;border-radius:12px;font:inherit}
              input{border:1px solid #d8e1db}
              button{border:0;background:#159447;color:#fff;font-weight:700;margin-top:12px}
              .ride{border:1px solid #dce7df;border-radius:14px;padding:14px;margin-top:12px;background:#fbfdfb}
              .row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}
              .status{padding:12px;border-radius:12px;background:#eef7f1;margin-top:14px;line-height:1.8}
              .err{color:#b42318;font-weight:700}
              .empty{color:#68766e;text-align:center;padding:20px}
            </style>
          </head>
          <body>
            <div class="wrap">

              <div class="card">
                <h1>🚗 سفر آنلاین</h1>
                <p class="sub">پنل راننده</p>

                <label>نام راننده</label>
                <input id="name" placeholder="نام و نام خانوادگی">

                <label>پلاک خودرو</label>
                <input id="plate" placeholder="مثلاً 12345 کابل">

                <button id="online">🟢 آنلاین شدن</button>

                <div id="msg" class="status">
                  برای دیدن سفرهای جدید آنلاین شوید.
                </div>
              </div>

              <div class="card">
                <h3>🚕 سفرهای در انتظار</h3>
                <div id="rides">
                  <div class="empty">هنوز آنلاین نشده‌اید.</div>
                </div>
              </div>

              <div class="card" id="activeCard" style="display:none">
                <h3>سفر فعال</h3>
                <div id="active"></div>
              </div>

            </div>

            <script>
              const PROJECT="safaronline";
              const API_KEY="AIzaSyCBVjmIfqL0fHTu76PfrMHVgAVwB_uZb30";
              const BASE=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;

              let timer=null;
              let activeName=null;

              function field(v){
                return v&&v.stringValue!==undefined?v.stringValue:"";
              }

              function num(v){
                return v&&v.doubleValue!==undefined
                  ?Number(v.doubleValue)
                  :(v&&v.integerValue!==undefined
                    ?Number(v.integerValue)
                    :0);
              }

              function esc(s){
                return String(s??"").replace(
                  /[&<>"']/g,
                  m=>({
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    "\"":"&quot;",
                    "'":"&#39;"
                  }[m])
                );
              }

              function msg(t,err=false){
                const e=document.getElementById("msg");
                e.textContent=t;
                e.className="status"+(err?" err":"");
              }

              async function listRides(){
                if(activeName){
                  await loadActive();
                  return;
                }

                try{
                  const r=await fetch(
                    `${BASE}/rides?pageSize=100&key=${API_KEY}`
                  );

                  const j=await r.json();

                  if(!r.ok){
                    throw new Error(
                      j?.error?.message||"خطای سرور"
                    );
                  }

                  const box=document.getElementById("rides");
                  box.innerHTML="";

                  const docs=(j.documents||[])
                    .filter(
                      d=>field(d.fields?.status)==="requested"
                    );

                  if(!docs.length){
                    box.innerHTML=
                      '<div class="empty">سفر جدیدی در انتظار نیست.</div>';
                    return;
                  }

                  docs.forEach(d=>{
                    const f=d.fields||{};
                    const div=document.createElement("div");

                    div.className="ride";

                    div.innerHTML=
                      `<b>🚕 سفر جدید</b>
                      <div class="row">
                        <span>مسافر</span>
                        <span>${esc(field(f.passengerName))}</span>
                      </div>
                      <div class="row">
                        <span>مبدا</span>
                        <span>${esc(field(f.from))}</span>
                      </div>
                      <div class="row">
                        <span>مقصد</span>
                        <span>${esc(field(f.to))}</span>
                      </div>
                      <div class="row">
                        <span>کرایه</span>
                        <span>${num(f.fare)} افغانی</span>
                      </div>
                      <button>قبول سفر</button>`;

                    div.querySelector("button").onclick=
                      ()=>acceptRide(d.name,f);

                    box.appendChild(div);
                  });

                }catch(e){
                  document.getElementById("rides").innerHTML=
                    '<div class="empty">❌ '+esc(e.message)+'</div>';
                }
              }

              async function acceptRide(name,f){
                const driver=
                  document.getElementById("name").value.trim();

                const plate=
                  document.getElementById("plate").value.trim();

                if(!driver||!plate){
                  msg("نام و پلاک را وارد کنید.",true);
                  return;
                }

                const body={
                  fields:{
                    passengerName:
                      f.passengerName||{stringValue:""},
                    phone:
                      f.phone||{stringValue:""},
                    from:
                      f.from||{stringValue:""},
                    to:
                      f.to||{stringValue:""},
                    fare:
                      f.fare||{doubleValue:0},
                    status:
                      {stringValue:"accepted"},
                    driverName:
                      {stringValue:driver},
                    driverPlate:
                      {stringValue:plate},
                    createdAt:
                      f.createdAt||
                      {timestampValue:new Date().toISOString()}
                  }
                };

                try{
                  const r=await fetch(
                    `${BASE}/${name}?key=${API_KEY}`,
                    {
                      method:"PATCH",
                      headers:{
                        "Content-Type":"application/json"
                      },
                      body:JSON.stringify(body)
                    }
                  );

                  const j=await r.json();

                  if(!r.ok){
                    throw new Error(
                      j?.error?.message||
                      "قبول سفر ناموفق بود"
                    );
                  }

                  activeName=name;

                  document.getElementById("activeCard")
                    .style.display="block";

                  msg("✅ سفر قبول شد.");

                  await loadActive();

                }catch(e){
                  msg("❌ "+e.message,true);
                }
              }              async function updateStatus(status){
                if(!activeName)return;

                try{
                  const r=await fetch(
                    `${BASE}/${activeName}?updateMask.fieldPaths=status&key=${API_KEY}`,
                    {
                      method:"PATCH",
                      headers:{
                        "Content-Type":"application/json"
                      },
                      body:JSON.stringify({
                        fields:{
                          status:{
                            stringValue:status
                          }
                        }
                      })
                    }
                  );

                  if(!r.ok){
                    throw new Error("تغییر وضعیت انجام نشد");
                  }

                  await loadActive();

                }catch(e){
                  msg("❌ "+e.message,true);
                }
              }

              async function loadActive(){
                if(!activeName)return;

                try{
                  const r=await fetch(
                    `${BASE}/${activeName}?key=${API_KEY}`
                  );

                  if(!r.ok){
                    activeName=null;
                    document.getElementById("activeCard")
                      .style.display="none";
                    return;
                  }

                  const j=await r.json();
                  const f=j.fields||{};
                  const s=field(f.status);

                  document.getElementById("active").innerHTML=
                    `<div class="ride">
                      <div class="row">
                        <b>وضعیت</b>
                        <b>${esc(s)}</b>
                      </div>

                      <div class="row">
                        <span>مبدا</span>
                        <span>${esc(field(f.from))}</span>
                      </div>

                      <div class="row">
                        <span>مقصد</span>
                        <span>${esc(field(f.to))}</span>
                      </div>

                      <div class="row">
                        <span>مسافر</span>
                        <span>${esc(field(f.passengerName))}</span>
                      </div>

                      <div class="row">
                        <span>کرایه</span>
                        <span>${num(f.fare)} افغانی</span>
                      </div>

                      ${
                        s==="accepted"
                        ?'<button id="start">🚗 شروع سفر</button>'
                        :""
                      }

                      ${
                        s==="started"
                        ?'<button id="finish">✅ پایان سفر</button>'
                        :""
                      }

                    </div>`;

                  document.getElementById("start")
                    ?.addEventListener(
                      "click",
                      ()=>updateStatus("started")
                    );

                  document.getElementById("finish")
                    ?.addEventListener(
                      "click",
                      ()=>{
                        updateStatus("completed");
                      }
                    );

                  if(s==="completed"||s==="cancelled"){
                    activeName=null;
                    document.getElementById("activeCard")
                      .style.display="none";
                  }

                }catch(e){
                  console.log(e);
                }
              }

              document.getElementById("online").onclick=async()=>{
                const name=
                  document.getElementById("name").value.trim();

                const plate=
                  document.getElementById("plate").value.trim();

                if(!name||!plate){
                  msg(
                    "نام و پلاک را کامل وارد کنید.",
                    true
                  );
                  return;
                }

                msg("✅ راننده آنلاین شد.");

                await listRides();

                if(timer)clearInterval(timer);

                timer=setInterval(
                  listRides,
                  5000
                );
              };
            </script>
          </body>
          </html>
          HTML

          cat > build-source/admin/www/index.html <<'HTML'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#18231d">
            <title>سفر آنلاین - مدیریت</title>
            <style>
              *{box-sizing:border-box}
              body{
                margin:0;
                font-family:Tahoma,Arial,sans-serif;
                background:#f3f7f4;
                color:#18231d
              }
              .wrap{
                max-width:760px;
                margin:auto;
                padding:16px
              }
              .card{
                background:#fff;
                border-radius:20px;
                padding:20px;
                box-shadow:0 5px 24px #00000012;
                margin-bottom:14px
              }
              h1{
                margin:0 0 4px;
                color:#18231d;
                font-size:27px
              }
              .sub{
                color:#65736b;
                margin:0 0 18px
              }
              .stats{
                display:grid;
                grid-template-columns:repeat(3,1fr);
                gap:9px
              }
              .stat{
                background:#eef7f1;
                border-radius:14px;
                padding:14px;
                text-align:center
              }
              .stat b{
                display:block;
                font-size:24px;
                color:#159447
              }
              .ride{
                border:1px solid #dce7df;
                border-radius:14px;
                padding:14px;
                margin-top:12px;
                background:#fbfdfb
              }
              .row{
                display:flex;
                justify-content:space-between;
                gap:10px;
                margin:7px 0
              }
              .muted{
                color:#68766e;
                font-size:13px
              }
              .empty{
                text-align:center;
                padding:20px;
                color:#68766e
              }
            </style>
          </head>

          <body>
            <div class="wrap">

              <div class="card">
                <h1>👑 سفر آنلاین</h1>
                <p class="sub">مرکز مدیریت آنلاین</p>

                <div class="stats">
                  <div class="stat">
                    <b id="all">0</b>
                    کل سفر
                  </div>

                  <div class="stat">
                    <b id="open">0</b>
                    درخواست
                  </div>

                  <div class="stat">
                    <b id="done">0</b>
                    تکمیل‌شده
                  </div>
                </div>
              </div>

              <div class="card">
                <h3>📋 سفرها</h3>

                <div id="rides">
                  <div class="empty">
                    در حال دریافت...
                  </div>
                </div>
              </div>

            </div>

            <script>
              const PROJECT="safaronline";

              const API_KEY=
                "AIzaSyCBVjmIfqL0fHTu76PfrMHVgAVwB_uZb30";

              const BASE=
                `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;

              function field(v){
                return v&&v.stringValue!==undefined
                  ?v.stringValue
                  :"";
              }

              function num(v){
                return v&&v.doubleValue!==undefined
                  ?Number(v.doubleValue)
                  :(v&&v.integerValue!==undefined
                    ?Number(v.integerValue)
                    :0);
              }

              function esc(s){
                return String(s??"").replace(
                  /[&<>"']/g,
                  m=>({
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    "\"":"&quot;",
                    "'":"&#39;"
                  }[m])
                );
              }

              async function load(){
                try{
                  const r=await fetch(
                    `${BASE}/rides?pageSize=100&key=${API_KEY}`
                  );

                  const j=await r.json();

                  if(!r.ok){
                    throw new Error(
                      j?.error?.message||
                      "خطای Firestore"
                    );
                  }

                  const docs=j.documents||[];

                  document.getElementById("all")
                    .textContent=docs.length;

                  document.getElementById("open")
                    .textContent=
                      docs.filter(
                        d=>[
                          "requested",
                          "accepted",
                          "started"
                        ].includes(
                          field(d.fields?.status)
                        )
                      ).length;

                  document.getElementById("done")
                    .textContent=
                      docs.filter(
                        d=>field(
                          d.fields?.status
                        )==="completed"
                      ).length;

                  const box=
                    document.getElementById("rides");

                  box.innerHTML="";

                  if(!docs.length){
                    box.innerHTML=
                      '<div class="empty">هنوز سفری ثبت نشده است.</div>';
                    return;
                  }

                  docs.reverse().forEach(d=>{
                    const f=d.fields||{};
                    const div=
                      document.createElement("div");

                    div.className="ride";

                    div.innerHTML=
                      `<div class="row">
                        <b>وضعیت</b>
                        <b>${esc(field(f.status))}</b>
                      </div>

                      <div class="row">
                        <span>مسافر</span>
                        <span>${esc(field(f.passengerName))}</span>
                      </div>

                      <div class="row">
                        <span>راننده</span>
                        <span>${esc(field(f.driverName)||"—")}</span>
                      </div>

                      <div class="row">
                        <span>مبدا</span>
                        <span>${esc(field(f.from))}</span>
                      </div>

                      <div class="row">
                        <span>مقصد</span>
                        <span>${esc(field(f.to))}</span>
                      </div>

                      <div class="row">
                        <span>کرایه</span>
                        <span>${num(f.fare)} افغانی</span>
                      </div>`;

                    box.appendChild(div);
                  });

                }catch(e){
                  document.getElementById("rides").innerHTML=
                    '<div class="empty">❌ '+
                    esc(e.message)+
                    '</div>';
                }
              }

              load();

              setInterval(
                load,
                5000
              );
            </script>
          </body>
          </html>
          HTML          for role in passenger driver admin; do
            cd "build-source/$role"

            npm init -y >/dev/null 2>&1

            npm install --no-audit --no-fund \
              @capacitor/core@7 \
              @capacitor/cli@7 \
              @capacitor/android@7

            cat > capacitor.config.json <<EOF
          {
            "appId": "com.safaronline.app.$role",
            "appName": "Safar Online - $role",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

            echo "Creating Android project for $role..."

            npx cap add android

            test -d android
            test -f android/gradlew

            chmod +x android/gradlew

            npx cap sync android

            test -d android/app

            cd ../..
          done

      - name: Build Passenger APK
        shell: bash
        run: |
          set -euo pipefail

          cd build-source/passenger/android

          test -f gradlew

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

          cp app/build/outputs/apk/debug/app-debug.apk \
            ../../../dist/safar-online-passenger.apk

      - name: Build Driver APK
        shell: bash
        run: |
          set -euo pipefail

          cd build-source/driver/android

          test -f gradlew

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

          cp app/build/outputs/apk/debug/app-debug.apk \
            ../../../dist/safar-online-driver.apk

      - name: Build Admin APK
        shell: bash
        run: |
          set -euo pipefail

          cd build-source/admin/android

          test -f gradlew

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

          cp app/build/outputs/apk/debug/app-debug.apk \
            ../../../dist/safar-online-admin.apk

      - name: Verify all APKs
        shell: bash
        run: |
          set -euo pipefail

          ls -lh dist

          test -s dist/safar-online-passenger.apk
          test -s dist/safar-online-driver.apk
          test -s dist/safar-online-admin.apk

      - name: Upload final APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-FINAL-3-APKs
          path: dist/*.apk
