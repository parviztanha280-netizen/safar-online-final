name: Build 3 Safar Online APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. دریافت پروژه
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. آماده سازی سه نسخه
      # ==========================================
      - name: Prepare three applications
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PREPARING SAFAR ONLINE"
          echo "======================================"

          rm -rf safar-source
          rm -rf dist

          mkdir -p safar-source/passenger
          mkdir -p safar-source/driver
          mkdir -p safar-source/admin
          mkdir -p dist

          # --------------------------------------
          # کپی سورس اصلی برای Passenger
          # --------------------------------------
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ safar-source/passenger/

          # --------------------------------------
          # کپی سورس اصلی برای Driver
          # --------------------------------------
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ safar-source/driver/

          # --------------------------------------
          # کپی سورس اصلی برای Admin
          # --------------------------------------
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="safar-source" \
            --exclude="dist" \
            --exclude="passenger" \
            --exclude="driver" \
            --exclude="admin" \
            ./ safar-source/admin/

          echo ""
          echo "Three applications prepared."


      # ==========================================
      # 3. تنظیم Passenger
      # ==========================================
      - name: Configure Passenger
        shell: bash
        run: |
          set -e

          cd safar-source/passenger

          node -e "
          const fs = require('fs');

          const file = 'capacitor.config.json';

          let config = {};

          if (fs.existsSync(file)) {
            try {
              config = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (e) {
              config = {};
            }
          }

          config.appId = 'com.safaronline.app.passenger';
          config.appName = 'Safar Online Passenger';
          config.webDir = '.';

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2)
          );
          "

          echo "Passenger configuration:"
          cat capacitor.config.json


      # ==========================================
      # 4. تنظیم Driver
      # ==========================================
      - name: Configure Driver
        shell: bash
        run: |
          set -e

          cd safar-source/driver

          node -e "
          const fs = require('fs');

          const file = 'capacitor.config.json';

          let config = {};

          if (fs.existsSync(file)) {
            try {
              config = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (e) {
              config = {};
            }
          }

          config.appId = 'com.safaronline.app.driver';
          config.appName = 'Safar Online Driver';
          config.webDir = '.';

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2)
          );
          "

          echo "Driver configuration:"
          cat capacitor.config.json


      # ==========================================
      # 5. تنظیم Admin
      # ==========================================
      - name: Configure Admin
        shell: bash
        run: |
          set -e

          cd safar-source/admin

          node -e "
          const fs = require('fs');

          const file = 'capacitor.config.json';

          let config = {};

          if (fs.existsSync(file)) {
            try {
              config = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (e) {
              config = {};
            }
          }

          config.appId = 'com.safaronline.app.admin';
          config.appName = 'Safar Online Admin';
          config.webDir = '.';

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2)
          );
          "

          echo "Admin configuration:"
          cat capacitor.config.json


      # ==========================================
      # 6. بررسی فایل‌ها
      # ==========================================
      - name: Verify source files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING SOURCE FILES"
          echo "======================================"

          test -f safar-source/passenger/index.html
          test -f safar-source/passenger/package.json
          test -f safar-source/passenger/capacitor.config.json

          test -f safar-source/driver/index.html
          test -f safar-source/driver/package.json
          test -f safar-source/driver/capacitor.config.json

          test -f safar-source/admin/index.html
          test -f safar-source/admin/package.json
          test -f safar-source/admin/capacitor.config.json

          echo "All source files are OK."


      # ==========================================
      # 7. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 8. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 9. ساخت Passenger
      # ==========================================
      - name: Build Passenger APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING PASSENGER APK"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/passenger"

          npm install

          echo "Adding Android platform..."

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          echo "Syncing Capacitor..."

          npx cap sync android

          cd android

          chmod +x gradlew

          echo "Running Gradle..."

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-passenger.apk"

          echo ""
          echo "PASSENGER APK CREATED"


      # ==========================================
      # 10. ساخت Driver
      # ==========================================
      - name: Build Driver APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING DRIVER APK"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/driver"

          npm install

          echo "Adding Android platform..."

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          echo "Syncing Capacitor..."

          npx cap sync android

          cd android

          chmod +x gradlew

          echo "Running Gradle..."

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-driver.apk"

          echo ""
          echo "DRIVER APK CREATED"


      # ==========================================
      # 11. ساخت Admin
      # ==========================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/admin"

          npm install

          echo "Adding Android platform..."

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          echo "Syncing Capacitor..."

          npx cap sync android

          cd android

          chmod +x gradlew

          echo "Running Gradle..."

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-admin.apk"

          echo ""
          echo "ADMIN APK CREATED"


      # ==========================================
      # 12. بررسی APKهای نهایی
      # ==========================================
      - name: Check APK files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL APK CHECK"
          echo "======================================"

          ls -lh dist/

          test -f dist/safar-online-passenger.apk
          test -f dist/safar-online-driver.apk
          test -f dist/safar-online-admin.apk

          echo ""
          echo "======================================"
          echo "SUCCESS!"
          echo "ALL 3 APKs WERE CREATED."
          echo "======================================"


      # ==========================================
      # 13. قرار دادن APKها برای دانلود
      # ==========================================
      - name: Upload 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-three-apks
          path: dist/*.apk
          if-no-files-found: error
