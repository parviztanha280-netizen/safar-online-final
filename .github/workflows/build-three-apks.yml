name: Build 3 Safar Online APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # -----------------------------
      # 1. دریافت پروژه
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. پیدا کردن سورس سه برنامه
      # -----------------------------
      - name: Prepare Safar Online source
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "Preparing Safar Online source"
          echo "===================================="

          rm -rf safar-source
          rm -rf extracted-source

          mkdir -p safar-source

          # اگر سه پوشه در ریشه موجود باشند
          if [ -d "passenger" ] && [ -d "driver" ] && [ -d "admin" ]; then
            echo "Passenger/Driver/Admin folders found in repository."

            cp -a passenger safar-source/passenger
            cp -a driver safar-source/driver
            cp -a admin safar-source/admin

          else
            echo "Three app folders are not in repository root."
            echo "Searching for ZIP file..."

            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file was found."
              echo ""
              echo "Repository files:"
              find . -maxdepth 3 -print | sort
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            mkdir -p extracted-source

            unzip -o "$ZIP_FILE" -d extracted-source

            echo ""
            echo "Extracted folders:"
            find extracted-source -maxdepth 5 -type d | sort

            # پیدا کردن پوشه passenger
            PASSENGER_DIR=$(find extracted-source -type d -iname "passenger" -print -quit || true)

            # پیدا کردن پوشه driver
            DRIVER_DIR=$(find extracted-source -type d -iname "driver" -print -quit || true)

            # پیدا کردن پوشه admin
            ADMIN_DIR=$(find extracted-source -type d -iname "admin" -print -quit || true)

            echo ""
            echo "Passenger:"
            echo "$PASSENGER_DIR"

            echo "Driver:"
            echo "$DRIVER_DIR"

            echo "Admin:"
            echo "$ADMIN_DIR"

            if [ -z "$PASSENGER_DIR" ]; then
              echo "ERROR: passenger folder was not found inside ZIP."
              find extracted-source -maxdepth 5 -type f | sort
              exit 1
            fi

            if [ -z "$DRIVER_DIR" ]; then
              echo "ERROR: driver folder was not found inside ZIP."
              find extracted-source -maxdepth 5 -type f | sort
              exit 1
            fi

            if [ -z "$ADMIN_DIR" ]; then
              echo "ERROR: admin folder was not found inside ZIP."
              find extracted-source -maxdepth 5 -type f | sort
              exit 1
            fi

            cp -a "$PASSENGER_DIR" safar-source/passenger
            cp -a "$DRIVER_DIR" safar-source/driver
            cp -a "$ADMIN_DIR" safar-source/admin
          fi

          echo ""
          echo "===================================="
          echo "Final source structure"
          echo "===================================="

          find safar-source -maxdepth 3 -type f | sort

          echo ""
          echo "Checking required files..."

          test -f safar-source/passenger/package.json
          test -f safar-source/passenger/index.html

          test -f safar-source/driver/package.json
          test -f safar-source/driver/index.html

          test -f safar-source/admin/package.json
          test -f safar-source/admin/index.html

          echo ""
          echo "Source preparation completed successfully."

      # -----------------------------
      # 3. Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # -----------------------------
      # 4. Java
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------
      # 5. ساخت پوشه خروجی
      # -----------------------------
      - name: Create output folder
        shell: bash
        run: |
          mkdir -p dist

      # -----------------------------
      # 6. ساخت APK مسافر
      # -----------------------------
      - name: Build Passenger APK
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "BUILDING PASSENGER APK"
          echo "===================================="

          cd "$GITHUB_WORKSPACE/safar-source/passenger"

          echo "Installing npm packages..."
          npm install

          echo "Checking Capacitor..."

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-passenger.apk"

          echo "Passenger APK created."

      # -----------------------------
      # 7. ساخت APK راننده
      # -----------------------------
      - name: Build Driver APK
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "BUILDING DRIVER APK"
          echo "===================================="

          cd "$GITHUB_WORKSPACE/safar-source/driver"

          echo "Installing npm packages..."
          npm install

          echo "Checking Capacitor..."

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-driver.apk"

          echo "Driver APK created."

      # -----------------------------
      # 8. ساخت APK مدیریت
      # -----------------------------
      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "BUILDING ADMIN APK"
          echo "===================================="

          cd "$GITHUB_WORKSPACE/safar-source/admin"

          echo "Installing npm packages..."
          npm install

          echo "Checking Capacitor..."

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-admin.apk"

          echo "Admin APK created."

      # -----------------------------
      # 9. بررسی APKها
      # -----------------------------
      - name: Check APK files
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "CHECKING FINAL APK FILES"
          echo "===================================="

          ls -lh "$GITHUB_WORKSPACE/dist/"

          test -f "$GITHUB_WORKSPACE/dist/safar-online-passenger.apk"
          test -f "$GITHUB_WORKSPACE/dist/safar-online-driver.apk"
          test -f "$GITHUB_WORKSPACE/dist/safar-online-admin.apk"

          echo ""
          echo "ALL 3 APK FILES WERE CREATED SUCCESSFULLY."

      # -----------------------------
      # 10. آپلود سه APK
      # -----------------------------
      - name: Upload 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-three-apks
          path: dist/*.apk
          if-no-files-found: error
