          for role in passenger driver admin
          do

            cat > build-source/$role/capacitor.config.json <<EOF
{
  "appId": "com.safaronline.app.$role",
  "appName": "Safar Online $role",
  "webDir": "www",
  "server": {
    "androidScheme": "https"
  }
}
EOF

            cd build-source/$role

            npm init -y

            npm install \
              @capacitor/core \
              @capacitor/cli \
              @capacitor/android

            npx cap add android

            npx cap sync android

            cd ../..

          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Passenger
        run: |
          cd build-source/passenger/android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk \
            ../../../dist/safar-online-passenger.apk

      - name: Build Driver
        run: |
          cd build-source/driver/android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk \
            ../../../dist/safar-online-driver.apk

      - name: Build Admin
        run: |
          cd build-source/admin/android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk \
            ../../../dist/safar-online-admin.apk

      - name: Verify APKs
        run: |
          ls -lh dist

          test -s dist/safar-online-passenger.apk
          test -s dist/safar-online-driver.apk
          test -s dist/safar-online-admin.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-FIREBASE-FIXED-3-APKS
          path: dist/*.apk
