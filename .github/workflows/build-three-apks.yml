name: Build 3 Safar Online APKs - Firebase Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create role apps
        shell: bash
        run: |
          set -e

          rm -rf build-source dist
          mkdir -p build-source/passenger/www
          mkdir -p build-source/driver/www
          mkdir -p build-source/admin/www
          mkdir -p dist

          cat > build-source/passenger/www/index.html <<'HTML'
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سفر آنلاین - مسافر</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6f8;margin:0;padding:20px;color:#17202a}
.box{max-width:520px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px #0001}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px;font-size:16px}
input{border:1px solid #ddd}
button{background:#16834b;color:#fff;border:0;font-weight:bold}
.status{padding:14px;background:#eef7f1;border-radius:10px;margin-top:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h1>👤 سفر آنلاین</h1>
<h3>پنل مسافر</h3>

<input id="name" placeholder="نام مسافر">
<input id="phone" placeholder="شماره موبایل">
<input id="from" placeholder="مبدأ">
<input id="to" placeholder="مقصد">
<input id="fare" type="number" placeholder="کرایه پیشنهادی">

<button id="request">🚕 درخواست سفر</button>

<div id="status" class="status">
در حال آماده‌سازی اتصال...
</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp,
doc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCBVjmIfqL0fHTu76PfrMHVgAVwB_uZb30",
authDomain:"safaronline.firebaseapp.com",
projectId:"safaronline",
storageBucket:"safaronline.firebasestorage.app",
messagingSenderId:"945083323788",
appId:"1:945083323788:android:ee98efa3e671bd549cf2a9"
};

const statusEl=document.getElementById("status");
const button=document.getElementById("request");

let db;
let ready=false;

try{
const app=initializeApp(firebaseConfig);
db=getFirestore(app);
ready=true;

statusEl.textContent=
"✅ اتصال آماده است. اطلاعات سفر را وارد کنید.";

}catch(e){

statusEl.textContent=
"❌ خطای اتصال Firebase:\n"+
(e?.message||e);

}

button.addEventListener("click",async()=>{

if(!ready){
statusEl.textContent="❌ Firebase آماده نیست.";
return;
}

const name=
document.getElementById("name").value.trim();

const phone=
document.getElementById("phone").value.trim();

const from=
document.getElementById("from").value.trim();

const to=
document.getElementById("to").value.trim();

const fare=
Number(document.getElementById("fare").value||0);

if(!from||!to){

statusEl.textContent=
"⚠️ مبدأ و مقصد را وارد کنید.";

return;
}

button.disabled=true;

statusEl.textContent=
"⏳ در حال ثبت درخواست...";

try{

const ref=await addDoc(
collection(db,"rides"),
{
name,
phone,
from,
to,
fare,
status:"requested",
createdAt:serverTimestamp()
}
);

statusEl.textContent=
"✅ درخواست ثبت شد.\n"+
"شناسه سفر: "+ref.id+
"\nمنتظر پذیرش راننده هستید.";

onSnapshot(
doc(db,"rides",ref.id),
snap=>{

if(!snap.exists())return;

const r=snap.data();

statusEl.textContent=
"وضعیت سفر: "+
(r.status||"نامشخص")+
(r.driverName
?"\nراننده: "+r.driverName:"")+
(r.plate
?"\nپلاک: "+r.plate:"");

}
);

}catch(e){

button.disabled=false;

statusEl.textContent=
"❌ ثبت سفر انجام نشد:\n"+
(e?.message||e);

}

});
</script>
</body>
</html>
HTML

          cat > build-source/driver/www/index.html <<'HTML'
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سفر آنلاین - راننده</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6f8;margin:0;padding:20px;color:#17202a}
.box{max-width:520px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px #0001}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px;font-size:16px}
input{border:1px solid #ddd}
button{background:#1769aa;color:#fff;border:0;font-weight:bold}
.ride{background:#f1f5f9;padding:15px;border-radius:12px;margin:12px 0}
.status{padding:14px;background:#eef4fa;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>

<div class="box">

<h1>🚗 سفر آنلاین</h1>
<h3>پنل راننده</h3>

<input id="driver" placeholder="نام راننده">
<input id="plate" placeholder="شماره پلاک">

<button id="online">
🟢 آنلاین شدن
</button>

<div id="status" class="status">
آماده‌سازی...
</div>

<div id="list"></div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
onSnapshot,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCBVjmIfqL0fHTu76PfrMHVgAVwB_uZb30",
authDomain:"safaronline.firebaseapp.com",
projectId:"safaronline",
storageBucket:"safaronline.firebasestorage.app",
messagingSenderId:"945083323788",
appId:"1:945083323788:android:b2377a46b317584a9cf2a9"
};

const statusEl=
document.getElementById("status");

const button=
document.getElementById("online");

let db;
let ready=false;

try{

db=getFirestore(
initializeApp(firebaseConfig)
);

ready=true;

statusEl.textContent=
"✅ اتصال آماده است. برای دریافت سفر آنلاین شوید.";

}catch(e){

statusEl.textContent=
"❌ خطای اتصال Firebase:\n"+
(e?.message||e);

}

button.addEventListener("click",()=>{

if(!ready){

statusEl.textContent=
"❌ Firebase آماده نیست.";

return;
}

button.disabled=true;

button.textContent=
"🟢 راننده آنلاین است";

statusEl.textContent=
"در حال دریافت درخواست‌های جدید...";

const q=query(
collection(db,"rides"),
where("status","==","requested")
);

onSnapshot(q,snapshot=>{

const list=
document.getElementById("list");

list.innerHTML="";

if(snapshot.empty){

statusEl.textContent=
"🟢 آنلاین هستید.\nدرخواست جدیدی وجود ندارد.";

return;
}

statusEl.textContent=
"🟢 آنلاین هستید.\nدرخواست‌های جدید:";

snapshot.forEach(item=>{

const r=item.data();

const box=
document.createElement("div");

box.className="ride";

box.innerHTML=
"<b>مبدأ:</b> "+(r.from||"-")+
"<br><b>مقصد:</b> "+(r.to||"-")+
"<br><b>کرایه:</b> "+(r.fare||0)+
"<br><b>مسافر:</b> "+(r.name||"-");

const accept=
document.createElement("button");

accept.textContent=
"✅ قبول سفر";

accept.onclick=async()=>{

accept.disabled=true;

accept.textContent=
"⏳ در حال قبول...";

try{

await updateDoc(
doc(db,"rides",item.id),
{
status:"accepted",
driverName:
document.getElementById("driver").value||
"راننده سفر آنلاین",

plate:
document.getElementById("plate").value||""
}
);

accept.textContent=
"✅ سفر پذیرفته شد";

}catch(e){

accept.disabled=false;

accept.textContent=
"قبول سفر";

alert(
"خطا: "+(e?.message||e)
);

}

};

box.appendChild(accept);

list.appendChild(box);

});

},e=>{

statusEl.textContent=
"❌ خطا در دریافت سفرها:\n"+
(e?.message||e);

});

});

</script>

</body>
</html>
