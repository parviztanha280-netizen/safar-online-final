پرویز، این تصویر نشان می‌دهد هنوز همان فایل قبلی در GitHub قرار دارد؛ خطای L29 مربوط به YAML است و هنوز حتی مرحله ساخت APK شروع نشده.

من نسخه قبلی را بررسی کردم؛ خود فایل آماده‌ای که ساختم از نظر YAML معتبر است. بنابراین احتمالاً هنگام جایگزین‌کردن، بخشی از فایل قبلی مانده یا GitHub محتوای کامل را نگرفته است.

این بار ساده‌تر انجام بده
فایل فعلی را کامل پاک نکن و با کپی‌کردن متن هم درگیر نشو. از فایل آماده استفاده کن:

📥 دریافت فایل اصلاح‌شده کامل

بعد در GitHub:

فایل .github/workflows/build-three-apks.yml را باز کن.

Edit را بزن.

همه متن داخلش را پاک کن.

فایل دانلودشده را باز کن و کل محتوا را کپی کن.

داخل GitHub Paste کن.

Commit changes را بزن.

مهم: بعد از Commit، اگر Actions خودش اجرا شد، دیگر چیزی را دست نزن. اگر سبز شد، می‌رویم سراغ دانلود سه APK.

اگر باز هم L29 آمد، این بار هیچ فایل دیگری را تغییر نمی‌دهیم؛ همان لحظه از روی خط ۲۹ نسخه‌ای که واقعاً در GitHub ذخیره شده، مشکل را پیدا می‌کنیم.


