name: Build Safar Online - 3 APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create three apps
        shell: bash
        run: |
          set -e

          rm -rf build-source dist
          mkdir -p build-source/passenger/www
          mkdir -p build-source/driver/www
          mkdir -p build-source/admin/www
          mkdir -p dist

          cat > build-source/passenger/www/index.html <<'EOF'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>سفر آنلاین - مسافر</title>
          <style>
          body{font-family:Arial;background:#f3f6f4;padding:20px}
          main{max-width:500px;margin:auto;background:white;padding:20px;border-radius:18px}
          input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px}
          button{background:#16834b;color:white;border:0;font-weight:bold}
          </style>
          </head>
          <body>
          <main>
          <h2>🚕 سفر آنلاین</h2>
          <h3>درخواست سفر</h3>
          <input id="name" placeholder="نام مسافر">
          <input id="phone" placeholder="شماره تماس">
          <input id="from" placeholder="مبدا">
          <input id="to" placeholder="مقصد">
          <input id="fare" type="number" placeholder="کرایه به افغانی">
          <button id="request">🚕 درخواست سفر</button>
          <p id="msg"></p>
          </main>
          <script type="module">
          import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
          import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
          const firebaseConfig={
          apiKey:"AIzaSyCBVjmIfqL0fHTu76PfrMHVgAVwB_uZb30",
          authDomain:"safaronline.firebaseapp.com",
          projectId:"safaronline",
          storageBucket:"safaronline.firebasestorage.app",
          messagingSenderId:"945083323788"
          };
          const db=getFirestore(initializeApp(firebaseConfig));
          document.getElementById("request").onclick=async()=>{
          const msg=document.getElementById("msg");
          try{
          const ref=await addDoc(collection(db,"rides"),{
          passengerName:document.getElementById("name").value,
          phone:document.getElementById("phone").value,
          from:document.getElementById("from").value,
          to:document.getElementById("to").value,
          fare:Number(document.getElementById("fare").value||0),
          status:"requested",
          createdAt:serverTimestamp()
          });
          msg.textContent="درخواست ثبت شد: "+ref.id;
          }catch(e){msg.textContent="خطا: "+e.message}
          };
          </script>
          </body>
          </html>
          EOF

          cat > build-source/driver/www/index.html <<'EOF'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>سفر آنلاین - راننده</title>
          <style>
          body{font-family:Arial;background:#f3f6f4;padding:20px}
          main{max-width:550px;margin:auto;background:white;padding:20px;border-radius:18px}
          input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px}
          button{background:#16834b;color:white;border:0;font-weight:bold}
          .ride{border:1px solid #ddd;padding:14px;margin:10px 0;border-radius:12px}
          </style>
          </head>
          <body>
          <main>
          <h2>🚗 سفر آنلاین</h2>
          <input id="name" placeholder="نام راننده">
          <input id="plate" placeholder="پلاک خودرو">
          <button id="online">🟢 آنلاین شدن</button>
          <p id="msg"></p>
          <div id="rides"></div>
          </main>
          <script type="module">
          import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
          import{getFirestore,collection,query,where,onSnapshot,doc,updateDoc}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
          const firebaseConfig={
          apiKey:"AIzaSyCBVjmIfqL0fHTu76PfrMHVgAVwB_uZb30",
          authDomain:"safaronline.firebaseapp.com",
          projectId:"safaronline",
          storageBucket:"safaronline.firebasestorage.app",
          messagingSenderId:"945083323788"
          };
          const db=getFirestore(initializeApp(firebaseConfig));
          document.getElementById("online").onclick=()=>{
          document.getElementById("msg").textContent="راننده آنلاین شد";
          const q=query(collection(db,"rides"),where("status","==","requested"));
          onSnapshot(q,snap=>{
          const box=document.getElementById("rides");
          box.innerHTML="";
          snap.forEach(item=>{
          const r=item.data();
          const div=document.createElement("div");
          div.className="ride";
          div.innerHTML="<b>سفر جدید</b><br>مبدا: "+r.from+"<br>مقصد: "+r.to+"<br>کرایه: "+r.fare+" افغانی<br><button>قبول سفر</button>";
          div.querySelector("button").onclick=async()=>{
          await updateDoc(doc(db,"rides",item.id),{
          status:"accepted",
          driverName:document.getElementById("name").value,
          driverPlate:document.getElementById("plate").value
          });
          };
          box.appendChild(div);
          });
          });
          };
          </script>
          </body>
          </html>
          EOF

          cat > build-source/admin/www/index.html <<'EOF'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>سفر آنلاین - مدیریت</title>
          <style>
          body{font-family:Arial;background:#f3f6f4;padding:20px}
          main{max-width:650px;margin:auto;background:white;padding:20px;border-radius:18px}
          .ride{border:1px solid #ddd;padding:14px;margin:10px 0;border-radius:12px}
          </style>
          </head>
          <body>
          <main>
          <h2>👑 مدیریت سفر آنلاین</h2>
          <p id="count">در حال دریافت اطلاعات...</p>
          <div id="rides"></div>
          </main>
          <script type="module">
          import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
          import{getFirestore,collection,onSnapshot}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
          const firebaseConfig={
          apiKey:"AIzaSyCBVjmIfqL0fHTu76PfrMHVgAVwB_uZb30",
          authDomain:"safaronline.firebaseapp.com",
          projectId:"safaronline",
          storageBucket:"safaronline.firebasestorage.app",
          messagingSenderId:"945083323788"
          };
          const db=getFirestore(initializeApp(firebaseConfig));
          onSnapshot(collection(db,"rides"),snap=>{
          document.getElementById("count").textContent="تعداد سفرها: "+snap.size;
          const box=document.getElementById("rides");
          box.innerHTML="";
          snap.forEach(item=>{
          const r=item.data();
          const div=document.createElement("div");
          div.className="ride";
          div.innerHTML="<b>وضعیت: "+(r.status||"")+" </b><br>مسافر: "+(r.passengerName||"")+"<br>مبدا: "+(r.from||"")+"<br>مقصد: "+(r.to||"")+"<br>کرایه: "+(r.fare||0)+" افغانی";
          box.appendChild(div);
          });
          });
          </script>
          </body>
          </html>
          EOF

          for role in passenger driver admin; do
            cd build-source/$role
            npm init -y
            npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

            cat > capacitor.config.json <<EOF
          {
            "appId": "com.safaronline.app.$role",
            "appName": "Safar Online",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

            npx cap add android
            npx cap sync android
            cd ../..
          done

      - name: Build Passenger
        shell: bash
        run: |
          set -e
          cd build-source/passenger
          ./android/gradlew assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk ../../dist/safar-online-passenger.apk

      - name: Build Driver
        shell: bash
        run: |
          set -e
          cd build-source/driver
          ./android/gradlew assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk ../../dist/safar-online-driver.apk

      - name: Build Admin
        shell: bash
        run: |
          set -e
          cd build-source/admin
          ./android/gradlew assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk ../../dist/safar-online-admin.apk

      - name: Verify APKs
        shell: bash
        run: |
          set -e
          ls -lh dist
          test -s dist/safar-online-passenger.apk
          test -s dist/safar-online-driver.apk
          test -s dist/safar-online-admin.apk

      - name: Upload 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-3-apks-fixed
          path: dist/*.apk
