name: Build 3 Safar Online APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Find Safar Online source
      # ==========================================
      - name: Prepare Safar Online source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PREPARING SAFAR ONLINE"
          echo "======================================"

          rm -rf safar-source
          rm -rf extracted-source

          mkdir -p safar-source
          mkdir -p extracted-source

          # --------------------------------------
          # حالت اول:
          # سه پوشه واقعاً وجود دارند
          # --------------------------------------
          if [ -d "passenger" ] && \
             [ -d "driver" ] && \
             [ -d "admin" ]; then

            echo "Passenger/Driver/Admin folders found."

            cp -a passenger safar-source/passenger
            cp -a driver safar-source/driver
            cp -a admin safar-source/admin

          else

            echo "Application folders are not in root."
            echo "Searching all files for an archive..."

            ARCHIVE=""

            # --------------------------------------
            # همه فایل‌ها را بررسی می‌کنیم
            # --------------------------------------
            while IFS= read -r FILE; do

              echo "Testing:"
              echo "$FILE"

              if unzip -t "$FILE" >/dev/null 2>&1; then
                ARCHIVE="$FILE"
                echo "VALID ZIP FOUND:"
                echo "$FILE"
                break
              fi

            done < <(
              find . \
                -type f \
                ! -path "./.git/*" \
                ! -path "./safar-source/*" \
                ! -path "./extracted-source/*" \
                ! -path "./dist/*" \
                -print
            )

            # --------------------------------------
            # اگر آرشیو پیدا نشد
            # --------------------------------------
            if [ -z "$ARCHIVE" ]; then

              echo ""
              echo "======================================"
              echo "ERROR: NO VALID ZIP ARCHIVE FOUND"
              echo "======================================"

              echo ""
              echo "Repository files:"
              find . -maxdepth 3 -print | sort

              echo ""
              echo "The uploaded file is not a valid ZIP archive."

              exit 1
            fi

            # --------------------------------------
            # استخراج
            # --------------------------------------
            echo ""
            echo "Extracting archive..."
            echo "$ARCHIVE"

            unzip -o "$ARCHIVE" -d extracted-source

            echo ""
            echo "======================================"
            echo "EXTRACTED CONTENT"
            echo "======================================"

            find extracted-source -maxdepth 8 -print | sort

            # --------------------------------------
            # پیدا کردن Passenger
            # --------------------------------------
            PASSENGER_DIR=$(
              find extracted-source \
                -type d \
                -iname "passenger" \
                -print -quit || true
            )

            # --------------------------------------
            # پیدا کردن Driver
            # --------------------------------------
            DRIVER_DIR=$(
              find extracted-source \
                -type d \
                -iname "driver" \
                -print -quit || true
            )

            # --------------------------------------
            # پیدا کردن Admin
            # --------------------------------------
            ADMIN_DIR=$(
              find extracted-source \
                -type d \
                -iname "admin" \
                -print -quit || true
            )

            echo ""
            echo "Passenger:"
            echo "$PASSENGER_DIR"

            echo ""
            echo "Driver:"
            echo "$DRIVER_DIR"

            echo ""
            echo "Admin:"
            echo "$ADMIN_DIR"

            # --------------------------------------
            # بررسی Passenger
            # --------------------------------------
            if [ -z "$PASSENGER_DIR" ]; then
              echo ""
              echo "ERROR: passenger folder not found."
              exit 1
            fi

            # --------------------------------------
            # بررسی Driver
            # --------------------------------------
            if [ -z "$DRIVER_DIR" ]; then
              echo ""
              echo "ERROR: driver folder not found."
              exit 1
            fi

            # --------------------------------------
            # بررسی Admin
            # --------------------------------------
            if [ -z "$ADMIN_DIR" ]; then
              echo ""
              echo "ERROR: admin folder not found."
              exit 1
            fi

            # --------------------------------------
            # کپی سه برنامه
            # --------------------------------------
            cp -a "$PASSENGER_DIR" safar-source/passenger
            cp -a "$DRIVER_DIR" safar-source/driver
            cp -a "$ADMIN_DIR" safar-source/admin

          fi

          # ======================================
          # بررسی فایل‌های لازم
          # ======================================

          echo ""
          echo "======================================"
          echo "CHECKING PASSENGER"
          echo "======================================"

          find safar-source/passenger -maxdepth 2 -type f | sort

          echo ""
          echo "======================================"
          echo "CHECKING DRIVER"
          echo "======================================"

          find safar-source/driver -maxdepth 2 -type f | sort

          echo ""
          echo "======================================"
          echo "CHECKING ADMIN"
          echo "======================================"

          find safar-source/admin -maxdepth 2 -type f | sort

          # فایل‌های ضروری
          test -f safar-source/passenger/package.json
          test -f safar-source/passenger/index.html

          test -f safar-source/driver/package.json
          test -f safar-source/driver/index.html

          test -f safar-source/admin/package.json
          test -f safar-source/admin/index.html

          echo ""
          echo "======================================"
          echo "SOURCE READY"
          echo "======================================"


      # ==========================================
      # 3. Node
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 4. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 5. Output
      # ==========================================
      - name: Create output folder
        shell: bash
        run: |
          mkdir -p dist


      # ==========================================
      # 6. Passenger APK
      # ==========================================
      - name: Build Passenger APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILD PASSENGER"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/passenger"

          npm install

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-passenger.apk"

          echo "PASSENGER APK DONE"


      # ==========================================
      # 7. Driver APK
      # ==========================================
      - name: Build Driver APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILD DRIVER"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/driver"

          npm install

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-driver.apk"

          echo "DRIVER APK DONE"


      # ==========================================
      # 8. Admin APK
      # ==========================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILD ADMIN"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/admin"

          npm install

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-admin.apk"

          echo "ADMIN APK DONE"


      # ==========================================
      # 9. Final check
      # ==========================================
      - name: Check APK files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL APK CHECK"
          echo "======================================"

          ls -lh dist/

          test -f dist/safar-online-passenger.apk
          test -f dist/safar-online-driver.apk
          test -f dist/safar-online-admin.apk

          echo ""
          echo "======================================"
          echo "SUCCESS"
          echo "ALL 3 APKs WERE CREATED"
          echo "======================================"


      # ==========================================
      # 10. Upload APKs
      # ==========================================
      - name: Upload 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-three-apks
          path: dist/*.apk
          if-no-files-found: error
