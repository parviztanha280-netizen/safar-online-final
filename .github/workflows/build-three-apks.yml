name: Build 3 Safar Online APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. دریافت پروژه
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. پیدا کردن و آماده کردن سورس
      # ==========================================
      - name: Prepare Safar Online source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR SAFAR ONLINE SOURCE"
          echo "======================================"

          rm -rf safar-source
          rm -rf extracted-source

          mkdir -p safar-source
          mkdir -p extracted-source

          # ------------------------------------------
          # اگر سه پوشه واقعی وجود داشته باشند
          # ------------------------------------------
          if [ -d "./passenger" ] && \
             [ -d "./driver" ] && \
             [ -d "./admin" ]; then

            echo "Three application folders found."

            cp -a "./passenger" "safar-source/passenger"
            cp -a "./driver" "safar-source/driver"
            cp -a "./admin" "safar-source/admin"

          else

            echo "Three folders were not found."
            echo "Searching for ZIP archive by file type..."

            ZIP_FILE=""

            # ------------------------------------------
            # پیدا کردن ZIP حتی اگر پسوند .zip نداشته باشد
            # ------------------------------------------
            while IFS= read -r FILE; do

              if file "$FILE" 2>/dev/null | grep -qi "Zip archive"; then
                ZIP_FILE="$FILE"
                break
              fi

            done < <(
              find . \
                -maxdepth 3 \
                -type f \
                ! -path "./.git/*" \
                ! -path "./safar-source/*" \
                ! -path "./extracted-source/*" \
                -print
            )

            # ------------------------------------------
            # اگر ZIP پیدا نشد
            # ------------------------------------------
            if [ -z "$ZIP_FILE" ]; then

              echo ""
              echo "ERROR: ZIP archive was not found."
              echo ""
              echo "Files currently in repository:"
              find . -maxdepth 3 -type f -print | sort
              echo ""

              exit 1
            fi

            echo ""
            echo "ZIP ARCHIVE FOUND:"
            echo "$ZIP_FILE"
            echo ""

            echo "File information:"
            file "$ZIP_FILE"

            # ------------------------------------------
            # استخراج ZIP
            # ------------------------------------------
            unzip -o "$ZIP_FILE" -d extracted-source

            echo ""
            echo "======================================"
            echo "EXTRACTED CONTENT"
            echo "======================================"

            find extracted-source -maxdepth 6 -print | sort

            # ------------------------------------------
            # پیدا کردن passenger
            # ------------------------------------------
            PASSENGER_DIR=$(
              find extracted-source \
                -type d \
                -iname "passenger" \
                -print -quit || true
            )

            # ------------------------------------------
            # پیدا کردن driver
            # ------------------------------------------
            DRIVER_DIR=$(
              find extracted-source \
                -type d \
                -iname "driver" \
                -print -quit || true
            )

            # ------------------------------------------
            # پیدا کردن admin
            # ------------------------------------------
            ADMIN_DIR=$(
              find extracted-source \
                -type d \
                -iname "admin" \
                -print -quit || true
            )

            echo ""
            echo "PASSENGER:"
            echo "$PASSENGER_DIR"

            echo ""
            echo "DRIVER:"
            echo "$DRIVER_DIR"

            echo ""
            echo "ADMIN:"
            echo "$ADMIN_DIR"

            # ------------------------------------------
            # بررسی passenger
            # ------------------------------------------
            if [ -z "$PASSENGER_DIR" ]; then

              echo ""
              echo "ERROR: passenger folder was not found."
              echo ""
              echo "Extracted files:"
              find extracted-source -maxdepth 8 -print | sort

              exit 1
            fi

            # ------------------------------------------
            # بررسی driver
            # ------------------------------------------
            if [ -z "$DRIVER_DIR" ]; then

              echo ""
              echo "ERROR: driver folder was not found."
              echo ""
              echo "Extracted files:"
              find extracted-source -maxdepth 8 -print | sort

              exit 1
            fi

            # ------------------------------------------
            # بررسی admin
            # ------------------------------------------
            if [ -z "$ADMIN_DIR" ]; then

              echo ""
              echo "ERROR: admin folder was not found."
              echo ""
              echo "Extracted files:"
              find extracted-source -maxdepth 8 -print | sort

              exit 1
            fi

            # ------------------------------------------
            # کپی سه برنامه
            # ------------------------------------------
            cp -a "$PASSENGER_DIR" "safar-source/passenger"
            cp -a "$DRIVER_DIR" "safar-source/driver"
            cp -a "$ADMIN_DIR" "safar-source/admin"

          fi

          echo ""
          echo "======================================"
          echo "CHECKING APPLICATION FILES"
          echo "======================================"

          echo ""
          echo "Passenger files:"
          find safar-source/passenger -maxdepth 2 -type f | sort

          echo ""
          echo "Driver files:"
          find safar-source/driver -maxdepth 2 -type f | sort

          echo ""
          echo "Admin files:"
          find safar-source/admin -maxdepth 2 -type f | sort

          # ------------------------------------------
          # بررسی فایل‌های اصلی
          # ------------------------------------------
          test -f safar-source/passenger/package.json
          test -f safar-source/passenger/index.html

          test -f safar-source/driver/package.json
          test -f safar-source/driver/index.html

          test -f safar-source/admin/package.json
          test -f safar-source/admin/index.html

          echo ""
          echo "======================================"
          echo "SOURCE PREPARATION SUCCESSFUL"
          echo "======================================"

      # ==========================================
      # 3. نصب Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # 4. نصب Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 5. ساخت پوشه خروجی
      # ==========================================
      - name: Create output folder
        shell: bash
        run: |
          mkdir -p dist

      # ==========================================
      # 6. ساخت APK مسافر
      # ==========================================
      - name: Build Passenger APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING PASSENGER APK"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/passenger"

          npm install

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-passenger.apk"

          echo ""
          echo "PASSENGER APK READY"

      # ==========================================
      # 7. ساخت APK راننده
      # ==========================================
      - name: Build Driver APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING DRIVER APK"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/driver"

          npm install

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-driver.apk"

          echo ""
          echo "DRIVER APK READY"

      # ==========================================
      # 8. ساخت APK مدیریت
      # ==========================================
      - name: Build Admin APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING ADMIN APK"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/safar-source/admin"

          npm install

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/safar-online-admin.apk"

          echo ""
          echo "ADMIN APK READY"

      # ==========================================
      # 9. بررسی نهایی
      # ==========================================
      - name: Check APK files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL APK CHECK"
          echo "======================================"

          ls -lh dist/

          test -f dist/safar-online-passenger.apk
          test -f dist/safar-online-driver.apk
          test -f dist/safar-online-admin.apk

          echo ""
          echo "======================================"
          echo "ALL THREE APKs CREATED SUCCESSFULLY"
          echo "======================================"

      # ==========================================
      # 10. قرار دادن APKها برای دانلود
      # ==========================================
      - name: Upload 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: safar-online-three-apks
          path: dist/*.apk
          if-no-files-found: error
